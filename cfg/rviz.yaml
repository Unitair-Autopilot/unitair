          Class: rviz/WrenchStamped
          Enabled: false
          Force Arrow Scale: 1
          Force Color: 204; 51; 51
          Hide Small Values: false
          History Length: 1
          Name: rail
          Topic: /simulation/truth/wrench/rail
          Torque Arrow Scale: 1
          Torque Color: 204; 204; 51
          Unreliable: false
          Value: false
        - Alpha: 0.5
          Arrow Width: 0.1
          Class: rviz/WrenchStamped
          Enabled: false
          Force Arrow Scale: 1
          Force Color: 204; 51; 51
          Hide Small Values: false
          History Length: 1
